# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Sin el tema mono, LVGL usa su tema a color sobre una pantalla de 1 bit y todo
# sale al reves. Solo el status screen integrado lo activa via "imply", por eso
# hay que pedirlo a mano al usar uno custom.
CONFIG_LV_USE_THEME_MONO=y

# OJO: NO activar CONFIG_ZMK_DISPLAY_INVERT. El corne.dtsi del shield ya trae
# "inversion-on", o sea que el panel invierte por hardware. Activarlo ademas en
# LVGL invierte dos veces y deja el fondo encendido con los glifos en negro.
CONFIG_ZMK_POINTING=y

# El widget de bateria de ZMK queda apagado a proposito: lo reemplaza
# src/display/battery_alert.c, que lee los mV crudos del sensor y les aplica una
# curva de descarga LiPo real en vez de la recta 3450-4200 mV de ZMK. Solo se
# muestra en dos casos: parpadeando cuando la carga baja del 15%, y como avance
# de carga mientras hay cable conectado.
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=n

# ZMK_BLE ya hace "imply ZMK_BATTERY_REPORTING", pero lo pedimos explicito
# porque battery_alert.c depende de que el muestreo del ADC siga corriendo.
CONFIG_ZMK_BATTERY_REPORTING=y

# El font default del build es unscii_8 (solo ASCII 32-127), asi que no puede
# dibujar LV_SYMBOL_WARNING. Montserrat 12 si trae los glifos FontAwesome.
CONFIG_LV_FONT_MONTSERRAT_12=y

# En ZMK, LV_USE_LABEL solo se activa via "select" desde los widgets integrados.
# Como esta pantalla no usa ninguno, hay que pedirlo explicitamente o
# lv_label_create() ni siquiera queda declarado.
CONFIG_LV_USE_LABEL=y

# El status screen custom trae su propio font y objetos LVGL. El default de ZMK
# (4 KB) queda muy justo; con 8 KB hay margen de sobra.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Saca el render de LVGL de la system work queue y lo pasa a su propio hilo.
# Sin esto, cada frame bloquea la cola compartida ~46 ms (128x32 mono por I2C a
# 100 kHz) y eso se siente como lag al teclear.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Improve BLE stability for split reconnection and use stronger radio TX power.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
